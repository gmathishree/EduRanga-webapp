<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Infinite STEM Passwords - Gamified Edition</title>
<style>
  @keyframes fadeIn {from {opacity: 0;} to {opacity: 1;}}
  @keyframes shake {
    0%, 100% {transform: translateX(0);} 20%, 60% {transform: translateX(-8px);} 40%, 80% {transform: translateX(8px);}
  }
  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 10px #38bdf8; }
    50% { box-shadow: 0 0 25px #0ea5e9; }
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(120deg, #0f172a, #1e293b);
    color: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 10px;
  }
  .app-container {
    background: #1e293bcc;
    padding: 30px 25px 40px 25px;
    border-radius: 14px;
    width: 100%;
    max-width: 640px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
    position: relative;
    animation: fadeIn 1s ease forwards;
    display: flex;
    flex-direction: column;
  }
  h1, h2 {
    text-align: center;
    font-weight: 900;
    color: #38bdf8;
    margin-bottom: 10px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px #38bdf8;
    user-select: none;
  }
  .input-section {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin: 25px auto;
    max-width: 400px;
  }
  label {
    font-weight: 700;
    color: #38bdf8;
    margin-bottom: 8px;
  }
  input[type=text], select {
    background: #334155;
    color: #f1f5f9;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    transition: box-shadow 0.3s ease;
  }
  input[type=text]:focus, select:focus {
    outline: none;
    box-shadow: 0 0 8px #38bdf8;
  }
  button {
    margin-top: 20px;
    padding: 14px 20px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 900;
    cursor: pointer;
    user-select: none;
    transition: background 0.3s ease, box-shadow 0.6s ease;
    animation: pulseGlow 3.5s infinite;
    max-width: 250px;
    align-self: center;
  }
  button:hover:not(:disabled) {
    background: #0ea5e9;
    box-shadow: 0 0 15px #0ea5e9;
    transform: scale(1.07);
  }
  button:disabled {
    background: #64748b;
    cursor: not-allowed;
    animation: none;
    box-shadow: none;
    transform: none;
  }
  .question-section, .leaderboard-section {
    display: none;
    flex-direction: column;
    align-items: center;
  }
  .question-text {
    font-size: 20px;
    margin: 20px 0 15px 0;
    min-height: 65px;
    animation: fadeIn 0.5s ease forwards;
    text-align: center;
  }
  .answer-input {
    width: 100%;
    max-width: 350px;
    padding: 14px 14px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
    box-sizing: border-box;
    transition: box-shadow 0.3s ease;
    font-weight: 600;
  }
  .feedback {
    margin-top: 15px;
    font-weight: 900;
    font-size: 19px;
    min-height: 40px;
    user-select: none;
    text-align: center;
  }
  .feedback.correct {
    color: #a7f3d0;
    text-shadow: 0 0 7px #22c55e;
    animation: fadeIn 0.8s ease forwards;
  }
  .feedback.wrong {
    color: #fecaca;
    text-shadow: 0 0 6px #dc2626;
    animation: fadeIn 0.8s ease forwards;
  }
  .score, .level, .badges {
    margin-top: 18px;
    color: #facc15;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    user-select: none;
  }
  .progress-bar-container {
    background: #334155;
    border-radius: 10px;
    overflow: hidden;
    height: 14px;
    margin-top: 25px;
    box-shadow: inset 0 0 5px #0f172a;
    width: 100%;
    max-width: 400px;
  }
  .progress-bar {
    height: 100%;
    background: #38bdf8;
    width: 0%;
    transition: width 0.6s ease;
    border-radius: 10px;
  }
  .leaderboard-list {
    list-style: none;
    padding: 0;
    max-height: 180px;
    overflow-y: auto;
    border: 1px solid #475569;
    border-radius: 8px;
    background: #1e293bcc;
    width: 100%;
    max-width: 400px;
  }
  .leaderboard-list li {
    padding: 10px 12px;
    border-bottom: 1px solid #334155;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
  }
  .leaderboard-list li:last-child {
    border-bottom: none;
  }
</style>
</head>
<body>
  <main class="app-container" role="main" aria-label="Infinite STEM Passwords Gamified Quiz Game">

    <h1>Infinite STEM Passwords 🔑</h1>

    <!-- Start Page: sequential inputs -->
    <section id="startPage" class="input-section" aria-live="polite">
      <div id="nameInputSection">
        <label for="playerName">Enter your name:</label>
        <input type="text" id="playerName" placeholder="Type your name here" autocomplete="off" maxlength="15" />
      </div>

      <div id="gradeInputSection" style="display:none;">
        <label for="gradeSelect">Select Grade</label>
        <select id="gradeSelect" aria-label="Select grade">
          <option value="" disabled selected>Select Grade</option>
          <option value="6">Grade 6</option>
          <option value="7">Grade 7</option>
          <option value="8">Grade 8</option>
          <option value="9">Grade 9</option>
          <option value="10">Grade 10</option>
          <option value="11">Grade 11</option>
          <option value="12">Grade 12</option>
        </select>
      </div>

      <div id="subjectInputSection" style="display:none;">
        <label for="subjectSelect">Select Subject</label>
        <select id="subjectSelect" aria-label="Select STEM subject">
          <option value="" disabled selected>Select Subject</option>
          <option value="Science">Science</option>
          <option value="Technology">Technology</option>
          <option value="Engineering">Engineering</option>
          <option value="Mathematics">Mathematics</option>
        </select>
      </div>

      <button id="startGameBtn" disabled>Start Game</button>
    </section>

    <!-- Question Page -->
    <section id="questionPage" class="question-section" aria-live="polite" aria-label="Quiz question section">
      <div class="question-text" id="questionText">Question will appear here</div>
      <input
        type="text"
        id="answerInput"
        class="answer-input"
        placeholder="Enter your answer..."
        autocomplete="off"
        spellcheck="false"
        aria-describedby="feedbackText"
      />
      <button id="submitAnswerBtn" disabled>Submit Answer</button>

      <div id="feedbackText" class="feedback" role="alert"></div>

      <div class="score" id="scoreDisplay">Score: 0< /div>
      <div class="level" id="levelDisplay">Level: 1</div>

      <div class="progress-bar-container" aria-label="Progress through questions">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </section>

    <!-- Leaderboard Page -->
    <section id="leaderboardPage" class="leaderboard-section" aria-live="polite" aria-label="Leaderboard and end game">
      <h2>Leaderboard 🏆</h2>
      <ul class="leaderboard-list" id="leaderboardList"></ul>
      <button id="endGameBtn" style="margin-top: 30px;">End & Return</button>
    </section>
  </main>

<script>
  // Expanded question bank with Grade 6 Engineering questions
  const questionBank = [
    // Science (Grade 6)
    {q: "What are the three states of matter?", a: "Solid Liquid Gas", subject: "Science", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "Which part of the plant conducts photosynthesis?", a: "Leaf", subject: "Science", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "What gas do plants release during photosynthesis?", a: "Oxygen", subject: "Science", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "Water changes from liquid to gas by the process called?", a: "Evaporation", subject: "Science", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "What do we call animals that eat only plants?", a: "Herbivores", subject: "Science", gradeRange: [6, 6], difficulty: "Easy"},

    // Mathematics (Grade 6)
    {q: "What is the value of 7 x 8?", a: "56", subject: "Mathematics", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "How many degrees are in a right angle?", a: "90", subject: "Mathematics", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "What is the perimeter of a square with side 5 cm?", a: "20", subject: "Mathematics", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "If you have 3 apples and you get 2 more, how many apples do you have?", a: "5", subject: "Mathematics", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "Name the shape with four equal sides and four right angles.", a: "Square", subject: "Mathematics", gradeRange: [6, 6], difficulty: "Easy"},

    // Technology (Grade 6)
    {q: "What is the main device used to input data into a computer?", a: "Keyboard", subject: "Technology", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "What does CPU stand for?", a: "Central Processing Unit", subject: "Technology", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "Name the software to browse the internet.", a: "Web Browser", subject: "Technology", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "What is the file extension of a Microsoft Word document?", a: ".doc", subject: "Technology", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "What device lets you see images and text on the computer?", a: "Monitor", subject: "Technology", gradeRange: [6, 6], difficulty: "Easy"},

    // Engineering (Grade 6)
    {q: "What is a simple machine?", a: "A device that makes work easier", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "Name any three simple machines.", a: "Lever Pulley Inclined Plane", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "How many types of simple machines are there?", a: "Six", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "Which simple machine is a ramp?", a: "Inclined Plane", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "A seesaw is an example of which simple machine?", a: "Lever", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "What simple machine is used in a flagpole to raise a flag?", a: "Pulley", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "Which simple machine is a knife?", a: "Wedge", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "A screwdriver is an example of which simple machine?", a: "Wheel and Axle", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "A bottle cap is an example of which simple machine?", a: "Screw", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "What is the main function of a simple machine?", a: "To make work easier", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "Which simple machine helps to split or cut things?", a: "Wedge", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "Which simple machine helps to lift heavy objects with less effort?", a: "Lever", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "What simple machine is used in a bicycle?", a: "Wheel and Axle", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"},
    {q: "Which simple machine is used to hold things together?", a: "Screw", subject: "Engineering", gradeRange: [6, 6], difficulty: "Easy"}
  ];

  const playerNameInput = document.getElementById("playerName");
  const gradeSelect = document.getElementById("gradeSelect");
  const subjectSelect = document.getElementById("subjectSelect");
  const startGameBtn = document.getElementById("startGameBtn");

  const startPage = document.getElementById("startPage");
  const questionPage = document.getElementById("questionPage");
  const leaderboardPage = document.getElementById("leaderboardPage");

  const nameInputSection = document.getElementById("nameInputSection");
  const gradeInputSection = document.getElementById("gradeInputSection");
  const subjectInputSection = document.getElementById("subjectInputSection");

  const questionText = document.getElementById("questionText");
  const answerInput = document.getElementById("answerInput");
  const submitAnswerBtn = document.getElementById("submitAnswerBtn");
  const feedbackText = document.getElementById("feedbackText");
  const scoreDisplay = document.getElementById("scoreDisplay");
  const levelDisplay = document.getElementById("levelDisplay");
  const progressBar = document.getElementById("progressBar");

  const leaderboardList = document.getElementById("leaderboardList");
  const endGameBtn = document.getElementById("endGameBtn");

  let playerName = "";
  let selectedGrade = null;
  let selectedSubject = "";
  let filteredQuestions = [];
  let currentQuestionIndex = 0;
  let score = 0;

  // Show grade after valid name input
  playerNameInput.addEventListener("input", () => {
    if (playerNameInput.value.trim().length >= 2) {
      gradeInputSection.style.display = "block";
      gradeSelect.focus();
    } else {
      gradeInputSection.style.display = "none";
      subjectInputSection.style.display = "none";
      startGameBtn.disabled = true;
    }
  });

  // Show subject after valid grade selection
  gradeSelect.addEventListener("change", () => {
    if (gradeSelect.value) {
      subjectInputSection.style.display = "block";
      subjectSelect.focus();
    } else {
      subjectInputSection.style.display = "none";
      startGameBtn.disabled = true;
    }
  });

  // Enable start button after valid subject selection
  subjectSelect.addEventListener("change", () => {
    if (subjectSelect.value) {
      startGameBtn.disabled = false;
    } else {
      startGameBtn.disabled = true;
    }
  });

  // Utility to shuffle array randomly
  function shuffleArray(arr) {
    for(let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  // Filter and shuffle questions for the game
  function filterQuestionsForGame() {
    const grade = parseInt(selectedGrade);
    filteredQuestions = questionBank.filter(q =>
      grade === 6
        ? q.gradeRange[0] === 6 && q.gradeRange[1] === 6 && q.subject === selectedSubject && q.difficulty === "Easy"
        : grade >= q.gradeRange[0] && grade <= q.gradeRange[1] && q.subject === selectedSubject && q.difficulty === "Easy"
    );
    shuffleArray(filteredQuestions);
    filteredQuestions = filteredQuestions.slice(0, 10);
  }

  // Show current question and reset feedback/input/button states
  function showCurrentQuestion() {
    const q = filteredQuestions[currentQuestionIndex];
    questionText.textContent = q.q;
    answerInput.value = "";
    feedbackText.textContent = "";
    answerInput.disabled = false;
    submitAnswerBtn.disabled = true;
    progressBar.style.width = ((currentQuestionIndex) / 10) * 100 + "%";
    answerInput.focus();
  }

  // Validate answer and handle scoring and feedback
  function checkAnswer() {
    const userAns = answerInput.value.trim().toLowerCase().replace(/\s+/g, '');
    const correctAns = filteredQuestions[currentQuestionIndex].a.trim().toLowerCase().replace(/\s+/g, '');
    answerInput.disabled = true;
    submitAnswerBtn.disabled = true;

    if (userAns === correctAns) {
      score++;
      feedbackText.className = "feedback correct";
      feedbackText.textContent = "✅ Correct!";
    } else {
      feedbackText.className = "feedback wrong";
      feedbackText.textContent = `❌ Wrong! Correct answer: ${filteredQuestions[currentQuestionIndex].a}`;
    }
    scoreDisplay.textContent = `Score: ${score}`;

    setTimeout(() => {
      currentQuestionIndex++;
      if (currentQuestionIndex < filteredQuestions.length) {
        showCurrentQuestion();
      } else {
        showLeaderboardPage();
      }
    }, 1500);
  }

  // Show leaderboard and update with new score
  function showLeaderboardPage() {
    questionPage.style.display = "none";
    leaderboardPage.style.display = "flex";
    progressBar.style.width = "100%";
    updateLeaderboard();
  }

  // Save and display leaderboard top 10
  function updateLeaderboard() {
    if (!playerName) return;
    const leaderboard = JSON.parse(localStorage.getItem("stemLeaderboard") || "[]");
    leaderboard.push({name: playerName, score});
    leaderboard.sort((a,b) => b.score - a.score);
    if(leaderboard.length > 10) leaderboard.length = 10;
    localStorage.setItem("stemLeaderboard", JSON.stringify(leaderboard));
    leaderboardList.innerHTML = '';
    leaderboard.forEach(entry => {
      const li = document.createElement("li");
      li.innerHTML = `<span>${entry.name}</span><span>${entry.score}</span>`;
      leaderboardList.appendChild(li);
    });
  }

  // Reset app to start page and clear states
  function resetToStart() {
    leaderboardPage.style.display = "none";
    startPage.style.display = "flex";
    playerNameInput.value = "";
    gradeSelect.value = "";
    subjectSelect.value = "";
    gradeInputSection.style.display = "none";
    subjectInputSection.style.display = "none";
    startGameBtn.disabled = true;
    playerNameInput.focus();

    playerName = "";
    selectedGrade = null;
    selectedSubject = "";
    filteredQuestions = [];
    currentQuestionIndex = 0;
    score = 0;
    scoreDisplay.textContent = "Score: 0";
    levelDisplay.textContent = "Level: 1";
    feedbackText.textContent = "";
    progressBar.style.width = "0%";
  }

  // Handle Start Game button
  startGameBtn.addEventListener("click", () => {
    playerName = playerNameInput.value.trim();
    selectedGrade = gradeSelect.value;
    selectedSubject = subjectSelect.value;

    filterQuestionsForGame();

    if (filteredQuestions.length === 0) {
      alert("No questions available for this selection. Please choose different options.");
      return;
    }

    startPage.style.display = "none";
    questionPage.style.display = "flex";

    currentQuestionIndex = 0;
    score = 0;
    scoreDisplay.textContent = "Score: 0";
    levelDisplay.textContent = "Level: 1";
    progressBar.style.width = "0%";
    feedbackText.textContent = "";

    showCurrentQuestion();
  });

  // Enable Submit Answer button only if input not empty
  answerInput.addEventListener("input", () => {
    submitAnswerBtn.disabled = answerInput.value.trim() === "";
  });

  submitAnswerBtn.addEventListener("click", checkAnswer);

  answerInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter" && !submitAnswerBtn.disabled) {
      checkAnswer();
    }
  });

  endGameBtn.addEventListener("click", resetToStart);

  playerNameInput.focus();
</script>
</body>
</html>
